name: Stress model evaluation

on:
  push:
    branches:
      - feature/full-russian-rhyme-engine
    paths:
      - "scripts/evaluate_stress.py"
      - "data/stress_quality_cases.json"
      - ".github/workflows/stress-evaluation.yml"
      - "requirements.txt"

jobs:
  stress-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Evaluate Russian stress model
        run: python scripts/evaluate_stress.py
